command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: FRAUD_CATALOG
    value: "elexon_app_for_settlement_acc_catalog"
  - name: FRAUD_GOLD_SCHEMA
    value: "investec_fraud_aml_gold"
  - name: FRAUD_SILVER_SCHEMA
    value: "investec_fraud_aml_silver"
  # Serving warehouse the app queries run on. Shared workspace warehouse is fine
  # (queries are schema-scoped to investec_fraud_aml_*); override if isolating.
  - name: FRAUD_WAREHOUSE_ID
    value: "e227fa247dd5bedd"
  # Investec-specific Genie space + dashboard, both pointed at investec_fraud_aml_* and
  # provisioned during deployment (see DEPLOY.md step 4).
  - name: SENTINEL_GENIE_SPACE
    value: "01f1964fc35c10509e628e538ab4c3f8"
  - name: SENTINEL_DASHBOARD_ID
    value: "01f1843c859f1acb97f76971d642826c"
  - name: DATABRICKS_HOST
    value: "https://fevm-elexon-app-for-settlement-acc.cloud.databricks.com"
  # Mosaic AI model endpoint for every GenAI surface (SAR multi-agent, triage,
  # exec briefing, LLM-as-judge). Upgraded from meta-llama-3-3-70b to Anthropic
  # Claude Sonnet 4.5 for stronger grounded reasoning + regulator-ready SAR
  # narratives. Single source of truth (server/db.py reads this) — swap the model
  # here, no code change.
  - name: FRAUD_LLM_ENDPOINT
    value: "databricks-claude-sonnet-4-5"
